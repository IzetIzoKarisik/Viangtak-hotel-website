<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ได้รับคำขอจองแล้ว — โรงแรมเวียงตาก ริเวอร์ไซด์</title>
    <link rel="icon" href="assets/logo.jpeg" type="image/่jpeg">


    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&family=Fraunces:wght@400;500;600&family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .thanks-section .container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thanks-card {
            width: 100%;
            max-width: 30rem;
            text-align: center;
            padding: 3rem 2rem;
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
        }

        #reserve-page .thanks-card h1 {
            max-width: none;
            margin: 0.5rem 0 1.5rem;
        }

        .thanks-card p {
            font-family: var(--font-body);
            font-weight: 300;
            line-height: 1.9;
            color: var(--ink);
            margin: 0 0 2rem;
        }

        /* Thai needs a bit more room and no letter-spacing */
        #reserve-page .thanks-card .reserve-kicker {
            letter-spacing: 1px;
        }

        .thanks-card .event-btn {
            letter-spacing: normal;
            font-size: 0.95rem;
        }
    </style>
</head>

<body id="reserve-page">

    <main class="reserve-section thanks-section">
        <div class="container">
            <div class="thanks-card">

                <p class="reserve-kicker">ได้รับคำขอจองแล้ว</p>
                <h1>ขอบคุณค่ะ</h1>

                <p>
                    เจ้าหน้าที่ต้อนรับจะตรวจสอบห้องว่าง แล้วติดต่อกลับทางโทรศัพท์
                    ภายในไม่กี่ชั่วโมง ยังไม่มีการเรียกเก็บค่าใช้จ่ายใดๆ
                </p>

                <a href="index-th.html" class="event-btn">กลับสู่หน้าแรก</a>

            </div>
        </div>
    </main>

</body>

</html>
