<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap"
        rel="stylesheet">
    <title>Deluxe Room Booking form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="booking-page">
    <header class="hotel-header">
        <a href="index.html" class="logo">
            <span class="brand-name">The Viang Tak</span>
            <span class="sub-brand-name">Riverside Hotel</span>
        </a>

        <a class="back-btn" href="index.html#rooms"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="lucide lucide-arrow-left">
                <path d="m12 19-7-7 7-7" />
                <path d="M19 12H5" />
            </svg>
            all rooms
        </a>
    </header>

    <div class="container">
        <div class="room-selected">
            <article class="room-card">

                <div class="room-photo">
                    <img loading="lazy" src="./assets/images/hotel/rooms/twin-beds-elephant-view.webp"
                        alt="A deluxe twin bed room with riverview" />
                </div>
                <div class="room-body">
                    <p class="booking-kicker">you are booking</p>
                    <h3>Deluxe Room</h3>
                    </p>
                    <ul>
                        <li>King or twin beds</li>
                        <li>32 m²</li>
                        <li>City / river view</li>
                    </ul>
                    <div class="room-foot">
                        <p class="room-price">฿1,500<span>/ night</span></p>
                        <a class="change-btn" href="index.html#rooms">Change room</a>
                    </div>
                </div>

            </article>
        </div>
        <div class="forn-container">

        </div>
    </div>
</body>

</html>
